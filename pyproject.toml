version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hoàng Ngọc Dung", email = "dunghoang0401237@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "delta-spark>=4.4.0",
    "google-api-python-client>=2.199.0",
    "kafka-python>=3.0.11",
    "nltk>=3.10.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
